# Run the whole dashboard locally:  docker compose up --build
# Frontend: http://localhost:8050   API docs: http://localhost:8000/docs
services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
  frontend:
    build: ./frontend
    env_file: .env
    environment:
      - API_BASE_URL=http://backend:8000
    ports:
      - "8050:8050"
    depends_on:
      backend:
        condition: service_healthy
